<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Terminal V2</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery.terminal/js/jquery.terminal.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery.terminal/js/unix_formatting.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jquery.terminal/css/jquery.terminal.min.css"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            height: 100vh;
            margin: 0;
            display: flex;
        }
        #sidebar {
            width: 250px;
            background-color: #1e293b;
            border-right: 1px solid #334155;
            display: flex;
            flex-direction: column;
            padding: 1rem;
        }
        #terminal-wrapper {
            flex-grow: 1;
            padding: 1rem;
            background-color: #000;
        }
        .command-btn {
            text-align: left;
            padding: 0.0rem 0.75rem;
            margin-bottom: 0.5rem;
            /* background-color: #334155; */
            border-radius: 0.375rem;
            font-size: 0.875rem;
            transition: background-color 0.2s;
            cursor: pointer;
        }
        .command-btn:hover {
            background-color: #475569;
        }
        .terminal {
            height: 100% !important;
            --size: 1.2;
        }
    </style>
</head>
<body>
    <div id="sidebar">
        <h2 class="text-xl font-bold mb-6 text-blue-400">Commands</h2>
        <div id="command-list" class="flex flex-col overflow-y-auto">
            <!-- Commands will be loaded here dynamically -->
        </div>
    </div>
    <div id="terminal-wrapper">
        <div id="terminal"></div>
    </div>

    <script>
        let ws;
        let term;
        let currentPath = '~';

        function updatePrompt(path) {
            // Shorten the path if it's the home directory
            const home = '/Users/arfan'; // This should ideally be dynamic but for now matches user env
            let displayPath = path;
            if (path.startsWith(home)) {
                displayPath = '~' + path.substring(home.length);
            }
            term.set_prompt(`[[b;green;]user@local][[;white;]:][[b;blue;]${displayPath}]$ `);
        }

        function connect() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}`);

            ws.onopen = () => {
                term.echo('[[b;green;]Connected to server]');
            };

            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                
                if (message.type === 'cwd') {
                    currentPath = message.data;
                    updatePrompt(currentPath);
                } else if (message.type === 'status') {
                    if (message.data === 'running') {
                        term.pause();
                        if (message.command && message.isBatch) {
                            const prompt = term.get_prompt();
                            term.echo(`${prompt}${message.command}`, { class: 'terminal-command-line' });
                        }
                    } else if (message.data === 'finished') {
                        term.resume();
                    }
                } else if (message.type === 'output') {
                    // Remove cursor show/hide and other non-formatting escape codes
                    let data = message.data.replace(/\x1b\[\?25[lh]/g, '');
                    
                    // Handle Clear Line (2K), Carriage Return (r)
                    if (data.includes('\r') || data.includes('\x1b[2K')) {
                        const parts = data.split(/\r|\x1b\[2K/);
                        const lastPart = parts[parts.length - 1];
                        
                        if (lastPart === '' && parts.length > 1) {
                            // If it ends with \r, it might be clearing for next update
                            return;
                        }

                        const terminal = $('#terminal').terminal();
                        const lastEcho = terminal.last();
                        
                        // If we are updating the same line (no newline in this chunk)
                        if (lastEcho && !data.includes('\n')) {
                            lastEcho.html($.terminal.ansi_to_formatting(lastPart));
                        } else {
                            // If there's a newline, we echo the processed part
                            terminal.echo($.terminal.ansi_to_formatting(lastPart));
                        }
                    } else {
                        term.echo(data);
                    }
                }
            };

            ws.onclose = () => {
                term.echo('[[b;red;]Disconnected from server. Retrying...]');
                setTimeout(connect, 2000);
            };
        }

        $(function() {
            // Load commands from HUML-powered API
            fetch('/api/commands')
                .then(response => response.json())
                .then(groups => {
                    const list = $('#command-list');
                    groups.forEach(groupObj => {
                        if (groupObj.commands && groupObj.commands.length > 0) {
                            // Add group header
                            const header = $('<div>')
                                .addClass('text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2 mt-4 first:mt-0')
                                .text(groupObj.group);
                            list.append(header);

                            groupObj.commands.forEach(cmd => {
                                const btn = $('<button>')
                                    .addClass('command-btn')
                                    .text(cmd.label)
                                    .click(() => run(cmd.command));
                                list.append(btn);
                            });
                        }
                    });
                })
                .catch(err => console.error('Error loading commands:', err));

            term = $('#terminal').terminal(function(command) {
                if (command !== '') {
                    ws.send(command);
                }
            }, {
                greetings: 'Web Terminal V2\nType commands or use the sidebar shortcuts.',
                name: 'web_terminal',
                prompt: '[[b;green;]user@local][[;white;]:][[b;blue;]~]$ '
            });

            connect();
        });

        function run(cmd) {
            const commands = Array.isArray(cmd) ? cmd : [cmd];
            // Send as array so server knows it's from a button (isBatch: true)
            ws.send(JSON.stringify(commands));
        }
    </script>
</body>
</html>
