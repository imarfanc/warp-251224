# List of terminal commands in YAML format
commands:
  - id: "pwd"
    label: "📍 pwd"
    command: "pwd"
  - id: "ls"
    label: "📁 ls -la"
    command: "ls -la"
  - id: "clear"
    label: "🧹 clear"
    command: "clear"
  - id: "whoami"
    label: "👤 whoami"
    command: "whoami"
  - id: "date"
    label: "📅 date"
    command: "date"
  - id: "uptime"
    label: "🕒 uptime"
    command: "uptime"
  - id: "git"
    label: "🌿 git status"
    command: "git status"
  - id: "node"
    label: "🟢 node -v"
    command: "node -v"
  - id: "echo"
    label: "💬 echo Hello"
    command: "echo Hello World"
