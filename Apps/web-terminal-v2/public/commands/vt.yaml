# VT CLI commands
commands:
  - id: "cd_example_val"
    label: "📂 cd Developer/vt"
    # command: "cd example-val"
    command: "cd /Users/arfan/Developer/vt"
  - id: "vt_clone"
    label: "🐑 vt clone"
    command: "vt clone example-val"
  - id: "vt_status"
    label: "📊 vt status"
    command: "vt status"
  - id: "vt_push"
    label: "🚀 vt push"
    command: "vt push"
  - id: "vt_pull"
    label: "📥 vt pull"
    command: "vt pull"
  - id: "vt_repush"
    label: "🔁 vt repush (wait 2s)"
    command: |
      vt push && {
        for i in 2 1; do
          printf "\r%s" "$(gum style --bold --foreground 212 "Re-pushing in ${i}s…")"
          sleep 1
        done
        echo
      } && vt push
