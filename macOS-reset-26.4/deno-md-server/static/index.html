<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/file-tree.css">
    <link rel="stylesheet" href="/code-copy.css">
    <link rel="stylesheet" href="/layout.css">
    <!-- highlight.js — theme + core (cdnjs) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <!-- Iconify 3.1.1 (@iconify/iconify). Types: https://cdnjs.cloudflare.com/ajax/libs/iconify/3.1.1/iconify.d.ts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/iconify/3.1.1/iconify.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <div id="sidebar" class="w-64 bg-white border-r overflow-y-auto p-4 shrink-0">
            <h1 class="text-xl font-bold mb-2 text-gray-800 text-right -mt-2">Files</h1>
            <label for="file-search" class="sr-only">Filter files by name or content</label>
            <input type="search" id="file-search" placeholder="Search name or content…" autocomplete="off"
                class="w-full mb-3 px-2.5 py-1.5 text-sm text-gray-800 placeholder:text-gray-400 border border-gray-200 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-400" />
            <section id="pinned-files" class="sidebar-pinned" hidden aria-label="Pinned files"></section>
            <div id="file-list" class="space-y-1">
                <div class="animate-pulse space-y-2">
                    <div class="h-4 bg-gray-200 rounded w-3/4"></div>
                    <div class="h-4 bg-gray-200 rounded w-1/2"></div>
                    <div class="h-4 bg-gray-200 rounded w-5/6"></div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto p-8">
            <div id="content" class="content-shell max-w-3xl mx-auto min-h-full flex flex-col gap-2.5">
                <p id="doc-path" class="doc-path hidden" aria-live="polite"></p>
                <!-- Cloned into #content-body on load; keep markup in sync with renderContentPlaceholder() -->
                <template id="content-placeholder-tpl">
                    <div class="text-gray-400 italic placeholder-msg">Select a file from the sidebar to view its content.</div>
                </template>
                <div id="content-body" class="bg-white p-8 rounded-lg shadow-sm min-h-[12rem] border border-gray-100/90"></div>
            </div>
        </main>
    </div>

    <button type="button" id="sidebar-fab" class="fab-sidebar" aria-label="Hide sidebar" title="Hide sidebar">
        <span class="iconify" data-icon="mdi:chevron-left" aria-hidden="true"></span>
    </button>

    <script type="module" src="/app.js"></script>
</body>
</html>
